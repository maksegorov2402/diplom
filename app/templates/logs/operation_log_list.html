{% extends 'base.html' %}
{% block content %}
<h1 class="h3 mb-3">Журнал операций</h1>
<table class="table table-striped bg-white shadow-sm"><thead><tr><th>Дата</th><th>Пользователь</th><th>Тип</th><th>Описание</th></tr></thead><tbody>{% for item in logs %}<tr><td>{{ item.created_at }}</td><td>{{ item.user|default:'—' }}</td><td>{{ item.get_operation_type_display }}</td><td>{{ item.description }}</td></tr>{% empty %}<tr><td colspan="4" class="text-center">Записей нет.</td></tr>{% endfor %}</tbody></table>
{% endblock %}
