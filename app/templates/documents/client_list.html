{% extends 'base.html' %}
{% block content %}
<div class="row g-4"><div class="col-lg-5"><div class="card"><div class="card-body"><h1 class="h4 mb-3">Новый клиент</h1><form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary">Сохранить</button></form></div></div></div><div class="col-lg-7"><div class="card"><div class="card-body"><h2 class="h4 mb-3">Клиенты</h2><table class="table"><tr><th>Название</th><th>Контакт</th><th>Телефон</th></tr>{% for item in clients %}<tr><td>{{ item.name }}</td><td>{{ item.contact_person|default:'—' }}</td><td>{{ item.phone|default:'—' }}</td></tr>{% empty %}<tr><td colspan="3">Клиентов нет.</td></tr>{% endfor %}</table></div></div></div></div>
{% endblock %}
