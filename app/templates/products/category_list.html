{% extends 'base.html' %}
{% block content %}
<div class="row g-4">
    <div class="col-lg-5"><div class="card"><div class="card-body"><h1 class="h4 mb-3">Новая категория</h1><form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary">Сохранить</button></form></div></div></div>
    <div class="col-lg-7"><div class="card"><div class="card-body"><h2 class="h4 mb-3">Категории</h2><table class="table"><tr><th>Название</th><th>Описание</th></tr>{% for category in categories %}<tr><td>{{ category.name }}</td><td>{{ category.description|default:'—' }}</td></tr>{% empty %}<tr><td colspan="2">Категорий нет.</td></tr>{% endfor %}</table></div></div></div>
</div>
{% endblock %}
