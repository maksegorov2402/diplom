{% extends 'base.html' %}
{% block content %}
<div class="row g-4">
    <div class="col-lg-5"><div class="card"><div class="card-body"><h1 class="h4 mb-3">Новая складская зона</h1><form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary">Сохранить</button></form></div></div></div>
    <div class="col-lg-7"><div class="card"><div class="card-body"><h2 class="h4 mb-3">Складские зоны</h2><div class="table-responsive"><table class="table"><tr><th>Название</th><th>Описание</th><th></th></tr>{% for location in locations %}<tr><td>{{ location.name }}</td><td>{{ location.description|default:'—' }}</td><td class="text-end"><a class="btn btn-sm btn-outline-primary" href="{% url 'location-update' location.pk %}">Редактирование</a></td></tr>{% empty %}<tr><td colspan="3">Зон нет.</td></tr>{% endfor %}</table></div></div></div></div>
</div>
{% endblock %}
